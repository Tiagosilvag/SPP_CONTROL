{% extends "base.html" %}
{% from "_macros.html" import page_header, form_actions %}
{% block content %}
{{ page_header('bi-graph-up-arrow', ('Editar Cotação' if cotacao else 'Nova Cotação')) }}

<form method="post" class="surface-card form-card p-4">
  <div class="row">
    <div class="col-md-8 mb-3">
      <label class="form-label">Obra / Projeto</label>
      <select class="form-select" name="obra_id" required>
        <option value="">Selecione...</option>
        {% for o in obras %}
        <option value="{{ o.id }}" {% if cotacao and cotacao.obra_id==o.id %}selected{% endif %}>{{ o.descricao }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Data da Cotação</label>
      <input type="date" class="form-control" name="data_cotacao" value="{{ cotacao.data_cotacao if cotacao and cotacao.data_cotacao else hoje }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Descrição</label>
    <input type="text" class="form-control" name="descricao" required placeholder="Ex: Recapeamento asfáltico, contratação de terceirizada..." value="{{ cotacao.descricao if cotacao else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Fornecedor (opcional)</label>
    <select class="form-select" name="fornecedor_id">
      <option value="">Selecione...</option>
      {% for f in fornecedores %}
      <option value="{{ f.id }}" {% if cotacao and cotacao.fornecedor_id==f.id %}selected{% endif %}>{{ f.nome }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Valor Cotado (mercado)</label>
      <div class="input-group">
        <span class="input-group-text">R$</span>
        <input type="number" step="0.01" min="0" class="form-control" name="valor_cotado" required value="{{ cotacao.valor_cotado if cotacao else '' }}">
      </div>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Valor Economizado no Projeto</label>
      <div class="input-group">
        <span class="input-group-text">R$</span>
        <input type="number" step="0.01" min="0" class="form-control" name="valor_economizado" value="{{ cotacao.valor_economizado if cotacao else 0 }}">
      </div>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Observações</label>
    <textarea class="form-control" name="observacoes" rows="3">{{ cotacao.observacoes if cotacao else '' }}</textarea>
  </div>
  {{ form_actions(url_for('cotacoes.listar')) }}
</form>
{% endblock %}
