{% extends "base.html" %}
{% from "_macros.html" import page_header, form_actions %}
{% block content %}
{{ page_header('bi-geo-alt', ('Editar Unidade' if unidade else 'Nova Unidade')) }}

<form method="post" class="surface-card form-card p-4">
  <div class="mb-3">
    <label class="form-label">Secretaria</label>
    <select class="form-select" name="secretaria_id" required>
      <option value="">Selecione...</option>
      {% for s in secretarias %}
      <option value="{{ s.id }}" {% if unidade and unidade.secretaria_id==s.id %}selected{% endif %}>{{ s.sigla }} - {{ s.nome }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Nome da Unidade</label>
    <input type="text" class="form-control" name="nome" required value="{{ unidade.nome if unidade else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Endereço</label>
    <input type="text" class="form-control" name="endereco" value="{{ unidade.endereco if unidade else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Responsável Local</label>
    <input type="text" class="form-control" name="responsavel_local" value="{{ unidade.responsavel_local if unidade else '' }}">
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="ativa" id="ativa" {% if not unidade or unidade.ativa %}checked{% endif %}>
    <label class="form-check-label" for="ativa">Unidade ativa</label>
  </div>
  {{ form_actions(url_for('unidades.listar')) }}
</form>
{% endblock %}
