{% extends "base.html" %}
{% from "_macros.html" import page_header, form_actions %}
{% block content %}
{{ page_header('bi-arrow-repeat', 'Nova Movimentação de Patrimônio') }}

<form method="post" class="surface-card form-card p-4">
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Tipo de Movimentação</label>
      <select class="form-select" name="tipo_movimentacao" id="tipo_movimentacao" required onchange="toggleCampos()">
        {% for t in tipos %}
        <option value="{{ t }}" {% if tipo_prefill==t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Data e Hora</label>
      <input type="datetime-local" class="form-control" name="data_movimentacao" value="{{ agora }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Bem Patrimonial</label>
    <select class="form-select" name="patrimonio_id" required>
      <option value="">Selecione...</option>
      {% for p in patrimonios %}
      <option value="{{ p.id }}">{{ p.num_patrimonio }} — {{ p.material_nome }} ({{ p.status }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Secretaria Proprietária</label>
      <select class="form-select" name="secretaria_proprietaria_id">
        <option value="">Selecione...</option>
        {% for s in secretarias %}
        <option value="{{ s.id }}">{{ s.sigla }} - {{ s.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Unidade Origem</label>
      <select class="form-select" name="unidade_origem_id">
        <option value="">Selecione...</option>
        {% for u in unidades %}
        <option value="{{ u.id }}">{{ u.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">Unidade Destino</label>
      <select class="form-select" name="unidade_destino_id">
        <option value="">Selecione...</option>
        {% for u in unidades %}
        <option value="{{ u.id }}">{{ u.nome }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Obra (opcional)</label>
    <select class="form-select" name="obra_id">
      <option value="">Nenhuma</option>
      {% for o in obras %}
      <option value="{{ o.id }}" {% if obra_id_prefill and (obra_id_prefill|string)==(o.id|string) %}selected{% endif %}>{{ o.codigo ~ ' - ' if o.codigo }}{{ o.descricao }}</option>
      {% endfor %}
    </select>
  </div>

  <div id="obras-fields" class="row" style="display:none;">
    <div class="col-md-6 mb-3">
      <label class="form-label">Obra de Origem</label>
      <select class="form-select" name="obra_origem_id">
        <option value="">Selecione...</option>
        {% for o in obras %}
        <option value="{{ o.id }}" {% if obra_id_prefill and (obra_id_prefill|string)==(o.id|string) %}selected{% endif %}>{{ o.codigo ~ ' - ' if o.codigo }}{{ o.descricao }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Obra de Destino</label>
      <select class="form-select" name="obra_destino_id">
        <option value="">Selecione...</option>
        {% for o in obras %}
        <option value="{{ o.id }}">{{ o.codigo ~ ' - ' if o.codigo }}{{ o.descricao }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div id="devolucao-fields" class="row" style="display:none;">
    <div class="col-md-6 mb-3">
      <label class="form-label">Data Prevista de Devolução</label>
      <input type="date" class="form-control" name="data_prev_devolucao">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Data Real de Devolução</label>
      <input type="date" class="form-control" name="data_real_devolucao">
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label">Responsável</label>
    <input type="text" class="form-control" name="responsavel">
  </div>
  <div class="mb-3">
    <label class="form-label">Observações</label>
    <textarea class="form-control" name="observacoes" rows="2"></textarea>
  </div>
  {{ form_actions(url_for('mov_patrimonio.listar'), 'Registrar Movimentação') }}
</form>

<script>
function toggleCampos() {
  const tipo = document.getElementById('tipo_movimentacao').value;
  document.getElementById('devolucao-fields').style.display = (tipo === 'Empréstimo' || tipo === 'Devolução') ? 'flex' : 'none';
  document.getElementById('obras-fields').style.display = (tipo === 'Transferência entre Obras') ? 'flex' : 'none';
}
document.addEventListener('DOMContentLoaded', toggleCampos);
</script>
{% endblock %}
