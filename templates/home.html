<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14151f">
<title>{{ sistema_nome }} — Seleção de Módulo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

<script>
  (function () {
    var stored = localStorage.getItem('spp-theme');
    var dark = stored ? stored === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  body.module-select {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  .module-card {
    display: block;
    height: 100%;
    padding: 1.75rem;
    text-decoration: none;
    color: inherit;
    transition: transform var(--transition-base), box-shadow var(--transition-base), border-color var(--transition-base);
  }
  .module-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: var(--color-primary);
    color: inherit;
  }
  .module-card-icon {
    width: 52px;
    height: 52px;
    border-radius: var(--radius-md);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    margin-bottom: 1.1rem;
  }
</style>
</head>
<body class="module-select">

<button type="button" class="icon-btn position-fixed top-0 end-0 m-3" data-theme-toggle aria-label="Alternar tema" title="Alternar tema claro/escuro">
  <i class="bi bi-moon-stars"></i>
</button>

<div style="max-width: 880px; width: 100%;">
  <div class="text-center mb-5">
    <span class="sidebar-brand-icon d-inline-flex mb-3" style="width: 52px; height: 52px; font-size: 1.4rem;"><i class="bi bi-shield-lock-fill"></i></span>
    <h1 class="page-title d-block" style="font-size: 1.75rem;">SPP - Control</h1>
    <p class="page-subtitle">Selecione um módulo para continuar</p>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <a href="{{ url_for('obras.listar') }}" class="surface-card module-card">
        <span class="module-card-icon badge-soft-info"><i class="bi bi-cone-striped"></i></span>
        <h2 class="h5 fw-bold mb-2">Gestão de Obras</h2>
        <p class="text-muted mb-0">Compras, estoque, patrimônio e movimentações organizados por obra.</p>
      </a>
    </div>
    {% if menu_permitido('cotacoes') %}
    <div class="col-md-6">
      <a href="{{ url_for('cotacoes.listar') }}" class="surface-card module-card">
        <span class="module-card-icon badge-soft-success"><i class="bi bi-graph-up-arrow"></i></span>
        <h2 class="h5 fw-bold mb-2">Cotação x Projeto</h2>
        <p class="text-muted mb-0">Compare o valor de mercado cotado com a economia obtida em cada projeto.</p>
      </a>
    </div>
    {% endif %}
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
