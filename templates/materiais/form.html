{% extends "base.html" %}
{% from "_macros.html" import page_header, form_actions %}
{% block content %}
{{ page_header('bi-box-seam', ('Editar Material' if material else 'Novo Material')) }}

<form method="post" class="surface-card form-card p-4">
  <div class="mb-3">
    <label class="form-label">Nome</label>
    <input type="text" class="form-control" name="nome" required value="{{ material.nome if material else '' }}">
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Tipo</label>
      <select class="form-select" name="tipo_material" required>
        <option value="Consumível" {% if material and material.tipo_material=='Consumível' %}selected{% endif %}>Consumível</option>
        <option value="Patrimonial" {% if material and material.tipo_material=='Patrimonial' %}selected{% endif %}>Patrimonial</option>
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Categoria</label>
      <select class="form-select" name="categoria">
        {% for c in categorias %}
        <option value="{{ c }}" {% if material and material.categoria==c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Unidade de Medida</label>
      <input type="text" class="form-control" name="unidade_medida" placeholder="Ex: Saco, m³, Un, Kg, Rolo" value="{{ material.unidade_medida if material else '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Estoque Mínimo</label>
      <input type="number" step="0.01" class="form-control" name="estoque_minimo" value="{{ material.estoque_minimo if material else 0 }}">
    </div>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="ativo" id="ativo" {% if not material or material.ativo %}checked{% endif %}>
    <label class="form-check-label" for="ativo">Material ativo</label>
  </div>
  {{ form_actions(url_for('materiais.listar')) }}
</form>
{% endblock %}
